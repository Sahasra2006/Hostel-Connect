apiVersion: v1
kind: Secret
metadata:
  name: mongodb-atlas-secret
  namespace: hostel-connect
type: Opaque
stringData:
  # Do NOT hardcode credentials here.
  # Create this secret manually using kubectl before deploying:
  #
  #   kubectl create secret generic mongodb-atlas-secret \
  #     --namespace hostel-connect \
  #     --from-literal=MONGO_URI="your-mongo-uri-here"
  #
  # Or use a secrets manager (AWS Secrets Manager, Vault, etc.)
  MONGO_URI: ""
