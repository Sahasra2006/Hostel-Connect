apiVersion: v1
kind: ConfigMap

metadata:
  name: prometheus-config
  namespace: hostel-connect

data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:

      # Prometheus self-monitoring
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # Backend metrics inside EKS
      - job_name: 'hostelconnect-backend'
        metrics_path: /metrics
        static_configs:
          - targets: ['backend-service:5000']